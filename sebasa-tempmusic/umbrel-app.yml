manifestVersion: 1
id: sebasa-tempmusic
name: Temp Music
icon: https://raw.githubusercontent.com/sebasa/umbrel-appstore/main/sebasa-tempmusic/icon.svg
tagline: Descargá música con yt-dlp, Beatport y Tidal; se borra sola a las 24 h
category: media
version: "1.0.0"
port: 7893
description: >-
  Pegás un link (YouTube, SoundCloud, Bandcamp, Beatport, Tidal, etc.) y la app corre
  yt-dlp, beatportdl o tidaler con tu configuración. Los archivos quedan disponibles para
  bajar desde el navegador y se eliminan automáticamente pasadas 24 horas.

  Las credenciales y opciones de cada herramienta se editan desde Ajustes. La app tiene su
  propio login (la contraseña que muestra Umbrel), así que se puede exponer de forma segura
  con un túnel de Cloudflare sin pasar por el login de Umbrel.
developer: Sebasa
