manifestVersion: 1.1
id: sebasa-tempmusic
storage:
  dataRoot: data
category: media
name: Temp Music
icon: https://raw.githubusercontent.com/sebasa/umbrel-appstore/main/sebasa-tempmusic/icon.svg
version: "1.0.1"
tagline: Descargá música con yt-dlp, Beatport y Tidal; se borra sola a las 24 h
description: >-
  Pegás un link (YouTube, SoundCloud, Bandcamp, Beatport, Tidal, etc.) y la app corre yt-dlp, beatportdl o tidaler con tu configuración. Los archivos quedan disponibles para bajar desde el navegador y se eliminan automáticamente pasadas 24 horas.


  Primer uso: entrá con la contraseña que Umbrel muestra para esta app, abrí Ajustes y cargá tus credenciales de Beatport (username y password) y/o iniciá sesión en Tidal.


  La app tiene su propio login, por eso Umbrel no pide el suyo: se puede exponer con un túnel de Cloudflare sin que choque con el login de Umbrel.
