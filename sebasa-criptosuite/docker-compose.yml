version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sebasa-criptosuite_web_1
      APP_PORT: 80

  web:
    # Imagen oficial multi-arch (amd64/arm64). Umbrel copia esta carpeta de la
    # app a ${APP_DATA_DIR} al instalar/actualizar, así que servimos los
    # archivos directamente sin depender de una imagen propia.
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/index.html:/usr/share/nginx/html/index.html:ro
      - ${APP_DATA_DIR}/tools:/usr/share/nginx/html/tools:ro
